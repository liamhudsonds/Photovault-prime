{% extends 'base.html' %}
{% block title %}Admin Login — PhotoVault{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
  <div class="auth-card" style="border-color:var(--gold);border-top:2px solid var(--gold);">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="font-size:2.5rem;">⬡</div>
      <h1 class="auth-title">Admin Access</h1>
      <p class="auth-sub">Restricted area — authorized personnel only</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" name="email" placeholder="admin@photovault.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-full">Enter Admin Panel</button>
    </form>
    <div class="auth-footer"><a href="{{ url_for('index') }}">← Back to site</a></div>
  </div>
</div>
{% endblock %}
