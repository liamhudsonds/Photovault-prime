{% extends 'base.html' %}

{% block title %}Categories{% endblock %}

{% block content %}
<div class="categories-page">
    <h1>Categories</h1>

    <div class="categories-grid">
        {% for category in categories %}
            <div class="category-card">
                <h3>{{ category.name }}</h3>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
