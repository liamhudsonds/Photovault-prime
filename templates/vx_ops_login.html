{% extends 'vx_base.html' %}
{% block title %}Operations Manager Login{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a1a3e 0%,#0d0d1a 70%)">
  <div class="card" style="max-width:400px;width:90%">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem;font-weight:900;color:var(--rose)">Vault<span style="color:var(--gold)">X</span></div>
      <div style="color:var(--muted);margin-top:.25rem">Operations Manager Portal</div>
    </div>
    <form method="POST">
      <div class="form-group"><label>Email</label><input type="email" name="email" required/></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required/></div>
      <button class="btn btn-rose" type="submit" style="width:100%">Login</button>
    </form>
  </div>
</div>
{% endblock %}
