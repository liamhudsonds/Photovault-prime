{% extends 'vx_base.html' %}
{% block title %}Create Creator Manager{% endblock %}
{% block navbar %}
<div class="navbar">
  <div class="brand">Vault<span>X</span></div>
  <nav><a href="/admin/vaultx">← Dashboard</a></nav>
</div>
{% endblock %}
{% block content %}
<div class="container" style="max-width:520px">
  <div class="page-header">
    <h1>👔 Create Creator Manager</h1>
    <p>Creator Managers manage assigned creators and earn commission.</p>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group"><label>Full Name</label><input type="text" name="name" required placeholder="John Smith"/></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required placeholder="manager@vaultx.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="8"/></div>
      <div class="form-group">
        <label>Assign to Operations Manager <span style="color:var(--muted)">(optional)</span></label>
        <select name="ops_manager_id">
          <option value="">— None —</option>
          {% for om in ops_managers %}
          <option value="{{om.id}}">{{om.name}} ({{om.user.email}})</option>
          {% endfor %}
        </select>
      </div>
      <button class="btn btn-rose" type="submit" style="width:100%">Create Creator Manager</button>
    </form>
  </div>
</div>
{% endblock %}
